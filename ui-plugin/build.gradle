plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'org.jetbrains.kotlin.plugin.compose'
}
android {
    namespace 'com.stupidtree.hita.ui.timetable'
    defaultConfig {
        applicationId 'com.stupidtree.hita.ui.timetable'
        minSdkVersion 23
        targetSdk 33
        compileSdk 36
        versionCode 1
        versionName '0.1.2'
    }
    buildFeatures { compose = true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = '1.8' }
}
dependencies {
    compileOnly 'io.github.kajimi16.ohmyhita:plugin-sdk:11.1'
    compileOnly "androidx.compose.runtime:runtime:$compose_version"
    compileOnly "androidx.compose.ui:ui:$compose_version"
    compileOnly "androidx.compose.foundation:foundation:$compose_version"
    compileOnly "androidx.compose.material:material:$compose_version"
    compileOnly "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3"
    compileOnly "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
}
